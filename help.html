<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Life Super App - Help</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container my-4 main-box">
    <!-- Top Header with Working Home & Opportunities Buttons -->
    <div class="d-flex justify-content-between align-items-center border-bottom border-dark pb-2 mb-4">
      <h1 class="h5 mb-0 fw-bold">Campus Help Page</h1>
      <div class="d-flex gap-2">
        <a href="index.html" class="btn btn-outline-dark btn-sm">Home</a>
        <a href="opportunities.html" class="btn btn-outline-dark btn-sm">Opportunities</a>
      </div>
    </div>

    <!-- Resource 1: Campus Security -->
    <div class="row align-items-center mb-3">
      <div class="col-3 col-md-2 text-center">
        <div class="user-icon mx-auto">&#128100;</div>
      </div>
      <div class="col-9 col-md-10">
        <div class="border border-dark p-2 bg-white">
          <ul class="mb-0 small">
            <li class="fw-bold">Campus Security</li>
            <li><a href="tel:2405550101">(240)-555-0101</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Resource 2: Harassment Report -->
    <div class="row align-items-center mb-3">
      <div class="col-3 col-md-2 text-center">
        <div class="user-icon mx-auto">&#128100;</div>
      </div>
      <div class="col-9 col-md-10">
        <div class="border border-dark p-2 bg-white">
          <ul class="mb-0 small">
            <li class="fw-bold">Harassment Report</li>
            <li><a href="tel:2405550102">(240)-555-0102</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Resource 3: Student Financial Services -->
    <div class="row align-items-center mb-3">
      <div class="col-3 col-md-2 text-center">
        <div class="user-icon mx-auto">&#128100;</div>
      </div>
      <div class="col-9 col-md-10">
        <div class="border border-dark p-2 bg-white">
          <ul class="mb-0 small">
            <li class="fw-bold">Student Financial Services</li>
            <li><a href="tel:2405550103">(240)-555-0103</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Resource 4: Mental Health Services -->
    <div class="row align-items-center mb-4">
      <div class="col-3 col-md-2 text-center">
        <div class="user-icon mx-auto">&#128100;</div>
      </div>
      <div class="col-9 col-md-10">
        <div class="border border-dark p-2 bg-white">
          <ul class="mb-0 small">
            <li class="fw-bold">Mental Health Services</li>
            <li><a href="tel:2405550104">(240)-555-0104</a></li>
          </ul>
        </div>
      </div>
    </div>

    <!-- Bottom AI Assistant Bar -->
    <div class="ai-bar p-2 text-center">
      <button id="aiToggle" class="btn w-100 fw-bold" type="button">+ AI</button>
      <div id="aiBox" class="mt-2 d-none text-start">
        <div class="input-group">
          <input type="text" id="aiInput" class="form-control" placeholder="Ask AI for campus help...">
          <button id="aiSend" class="btn btn-primary" type="button">Send</button>
        </div>
        <p id="aiOutput" class="small mt-2 mb-0 text-muted">AI ready.</p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
